services:
  # ---------------------------------------------------------------------------
  # Backend API — FastAPI Docker Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: kavach-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: kavach_db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://kavach-frontend.onrender.com"
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend — React + Vite Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: kavach-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
