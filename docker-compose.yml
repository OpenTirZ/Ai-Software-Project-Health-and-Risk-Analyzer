services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-health-backend:latest
    container_name: ai_health_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/project_health}
      - MONGO_DATABASE=${MONGO_DATABASE:-project_health}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-insecure_default_secret_key_change_in_production_32chars}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000
    depends_on:
      mongodb:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: project-health-frontend:latest
    container_name: ai_health_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
        required: false

  mongodb:
    image: mongo:7.0
    container_name: ai_health_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
