name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, "varshil/*" ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mongomock pytest pytest-asyncio pytest-mock

      - name: Run Pytest test suite
        env:
          MONGO_URI: "mongodb://localhost:27017"
          MONGO_DATABASE: "test_db"
          JWT_SECRET_KEY: "ci-test-secret-key-for-jwt-tokens-testing"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
        run: |
          pytest Backend/tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Run frontend unit tests
        working-directory: ./Frontend
        run: npm test

      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build
